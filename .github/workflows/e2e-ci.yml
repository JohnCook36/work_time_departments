name: Playwright E2E

on:
  pull_request:
    paths:
      - 'tests/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/e2e-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, worktime]
    timeout-minutes: 25
    steps:
      - name: Repair workspace ownership
        shell: bash
        run: |
          docker run --rm             -v "$GITHUB_WORKSPACE:/workspace"             alpine:3.20             sh -c "chown -R $(id -u):$(id -g) /workspace"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run E2E regression suite in Playwright Docker
        shell: bash
        run: |
          docker run --rm --ipc=host             --user "$(id -u):$(id -g)"             -e HOME=/tmp             -e CI=true             -v "$GITHUB_WORKSPACE:/work"             -w /work             mcr.microsoft.com/playwright:v1.63.0-noble             bash -lc "npm ci && npm run test:e2e"

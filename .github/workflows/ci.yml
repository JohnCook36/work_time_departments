name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Design token guard
        run: npm run check:design-tokens

      - name: Inline style guard
        run: npm run check:inline-styles

      - name: Tests (if present)
        run: npm test --if-present

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
